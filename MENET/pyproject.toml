[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "menet-core"
version = "0.1.0"
description = "Mixed-effects deep neural network for multi-environment agronomic trait prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "pandas==2.2.2",
  "scikit-learn==1.5.2",
  "scipy==1.13.1",
  "torch==2.13.0",
]

[tool.setuptools]
packages = ["network", "utils"]
